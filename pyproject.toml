[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-done"
version = "0.1.0"
description = "Keyboard navigation for Codex attention across desktop backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15,<18",
    "psutil>=6,<8; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10,<13; sys_platform == 'darwin'",
]

[project.scripts]
agent-done = "agent_done.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
