[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-done"
version = "0.1.0"
description = "Codex attention notifications for niri and Waybar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<18"]

[project.scripts]
agent-done = "agent_done.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
